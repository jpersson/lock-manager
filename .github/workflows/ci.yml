name: CI

on:
  push:
    branches:
      - main
      - proteus
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lock-manager/app
    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: 🏗 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lock-manager/app/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚨 Lint
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Test
        run: npm test

  addon-lint:
    name: Add-on configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: 🚀 Run Home Assistant Add-on Linter
        uses: frenck/action-addon-linter@v2.21.0
        with:
          path: "./lock-manager"

  docker:
    name: Docker (${{ matrix.arch }})
    needs: [app, addon-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/aarch64
    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: 🏗 Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷 Resolve image tag
        id: version
        run: |
          config_version=$(yq eval '.version' lock-manager/config.yaml)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "${config_version}" != "${tag_version}" ]]; then
              echo "::error ::config.yaml version '${config_version}' does not match tag '${tag_version}'"
              exit 1
            fi
            echo "image_tag=${config_version}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: ./lock-manager
          platforms: ${{ matrix.platform }}
          # Home Assistant add-on image naming: one image per architecture,
          # matching `image: ghcr.io/jpersson/lock-manager-{arch}` in config.yaml
          tags: ghcr.io/${{ github.repository_owner }}/lock-manager-${{ matrix.arch }}:${{ steps.version.outputs.image_tag }}
          push: ${{ steps.version.outputs.push == 'true' }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}